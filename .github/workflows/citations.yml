name: Update ADS citations

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch citation counts
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python3 scripts/update_citations.py
      - name: Commit if changed
        run: |
          # Only commit when a count changed, not just the timestamp
          if git diff --quiet -- data/citations.json; then exit 0; fi
          if [ "$(git diff -U0 -- data/citations.json | grep -E '^[+-] ' | grep -vc '"updated"')" = 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          git commit -m "Update ADS citation counts"
          git push
